[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-water-pump"
version = "0.1.0"
description = "Explainable AI water-pump decision-support system"
requires-python = ">=3.9"
dependencies = ["tomli>=2.0; python_version < '3.11'", "scikit-learn>=1.3,<1.6", "streamlit>=1.35,<2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
